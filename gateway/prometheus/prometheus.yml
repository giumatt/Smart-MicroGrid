global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trust_engine
    metrics_path: /metrics
    static_configs:
      - targets: ["trust_engine:8000"]

  - job_name: blockchain_service
    metrics_path: /metrics
    static_configs:
      - targets: ["blockchain_service:8001"]

  - job_name: provisioner
    metrics_path: /metrics
    static_configs:
      - targets: ["provisioner:5000"]
