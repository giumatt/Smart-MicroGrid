[platformio]
default_envs = esp32dev

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

[env:esp32dev]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

build_type = debug
upload_speed = 921600

build_flags =
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -DALLOW_INSECURE_MQTT=1
    -DSKIP_CERT_VERIFICATION=1
    -DSEND_INTERVAL_MS=5000
    -DSIMULATION_MODE=1

monitor_filters =
    esp32_exception_decoder
    time

board_build.partitions = default.csv

[env:esp32dev-test]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<src/main.cpp>

build_type = debug
upload_speed = 921600

build_flags =
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -DALLOW_INSECURE_MQTT=1
    -DSKIP_CERT_VERIFICATION=1
    -DSEND_INTERVAL_MS=5000
    -DSIMULATION_MODE=1

monitor_filters =
    esp32_exception_decoder
    time

board_build.partitions = default.csv

[env:esp32prod]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

build_type = release
upload_speed = 460800

build_flags =
    -Os
    -DNDEBUG
    -DDEBUG_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DALLOW_INSECURE_MQTT=0
    -DSKIP_CERT_VERIFICATION=0
    -DREQUIRE_VALID_TIMESTAMP=1
    -DMAX_PROVISIONING_RETRIES=5
    -DSEND_INTERVAL_MS=2000
    -DSIMULATION_MODE=1
    -DCONFIG_NVS_ENCRYPTION=1

monitor_filters = time

board_build.partitions = min_spiffs.csv

[env:esp32prod-test]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<src/main.cpp>

build_type = release
upload_speed = 460800

build_flags =
    -Os
    -DNDEBUG
    -DDEBUG_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DALLOW_INSECURE_MQTT=0
    -DSKIP_CERT_VERIFICATION=0
    -DREQUIRE_VALID_TIMESTAMP=1
    -DMAX_PROVISIONING_RETRIES=5
    -DSEND_INTERVAL_MS=2000
    -DSIMULATION_MODE=1
    -DCONFIG_NVS_ENCRYPTION=1

monitor_filters = time

board_build.partitions = min_spiffs.csv
